[pytest]
pythonpath = .
markers =
    regression: Run the regression test suite
    negative: Run the negative test suite for edge-case/validation scenarios
    exam: Run the exam management test cases
    eservices: Run the E-Services profile modification test cases
    auth: Run authentication and session validation tests
    dashboard: Run student/teacher dashboard validation tests
    lifecycle: Run assignment, SME and end-to-end evaluation lifecycle tests
    exam_logic: Run exam dates and scheduling logic tests
    critical: Run critical/priority test paths
    admin_assignment: Run admin assignment creation tests
    sme_registration: Run SME self-registration tests
    student_assignment: Run student assignment workflow tests
    assignment_status: Run assignment status verification tests
    result: Run result/rechecking/revaluation tests
    sme_evaluation: Run SME evaluation workflow tests
    full_assignment_workflow: Run the complete assignment lifecycle end-to-end
    smoke: Run quick smoke tests for sanity check

